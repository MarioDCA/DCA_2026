<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCA Kviz</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--light);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--secondary);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: var(--light);
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--dark);
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            padding: 15px 20px;
            border: 2px solid var(--light);
            background: white;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--secondary);
            background-color: #f8fbfe;
        }

        .option-badge {
            background: var(--light);
            color: var(--dark);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .option-btn.correct {
            border-color: var(--success);
            background-color: #e8f8f0;
            color: #27ae60;
        }

        .option-btn.correct .option-badge {
            background: var(--success);
            color: white;
        }

        .option-btn.wrong {
            border-color: var(--danger);
            background-color: #fdeaea;
            color: #c0392b;
        }

        .option-btn.wrong .option-badge {
            background: var(--danger);
            color: white;
        }

        .explanation {
            background-color: #f8f9fa;
            border-left: 4px solid var(--secondary);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: var(--light);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background-color: #bdc3c7;
        }

        .shortcut-hint {
            font-size: 0.8rem;
            color: #7f8c8d;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="index.html" class="back-btn">← Nazaj na seznam kvizov</a>
        <div id="quiz-title" style="font-weight: bold;">Nalaganje...</div>
        <div id="score-counter">Rezultat: 0</div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div id="quiz-content">
        <div class="question-title" id="question-text">Pripravljam vprašanje...</div>
        
        <div class="options-grid" id="options-container">
            <!-- Možnosti odgovorov se dinamično naložijo tukaj -->
        </div>

        <div class="explanation" id="explanation">
            <strong>Razlaga:</strong> <span id="explanation-text"></span>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="ponastaviKviz()">Ponastavi ta kviz</button>
            <button class="btn btn-primary" id="next-btn" onclick="naslednjeVprasanje()" style="display: none;">Naprej →</button>
        </div>

        <div class="shortcut-hint">
            💡 Namig: Odgovore lahko izbiraš tudi s tipkami <strong>1, 2, 3, 4</strong> na tipkovnici.
        </div>
    </div>
</div>

<script>
    // 1. PREBIRANJE PARAMETROV IZ URL-JA (npr. kviz.html?file=OR_01.json)
    const urlParams = new URLSearchParams(window.location.search);
    const jsonFile = urlParams.get('file') || 'OR_01.json';
    
    // Unikatni ključ za spomin brskalnika za vsak JSON kviz posebej
    const STORAGE_KEY = `dca_napredek_${jsonFile}`;

    let vprasanja = [];
    let trenutnoVprasanje = 0;
    let rezultat = 0;
    let odgovoreno = false;

    // Elementi na strani
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const explanationDiv = document.getElementById('explanation');
    const explanationText = document.getElementById('explanation-text');
    const nextBtn = document.getElementById('next-btn');
    const scoreCounter = document.getElementById('score-counter');
    const progressFill = document.getElementById('progress-fill');
    const quizTitle = document.getElementById('quiz-title');

    // 2. NALAGANJE JSON DATOTEKE IN SHRANJENEGA STANJA
    function zagonKviza() {
        quizTitle.textContent = jsonFile.replace('.json', '');

        fetch(jsonFile)
            .then(res => res.json())
            .then(data => {
                vprasanja = data; // Vprašanja v originalnem (fiksnem) vrstnem redu za tečaj
                naloziNapredek();
                prikaziVprasanje();
            })
            .catch(err => {
                questionText.textContent = "Napaka pri nalaganju kviza. Preveri, ali datoteka obstaja.";
                console.error("Napaka:", err);
            });
    }

    // 3. NALAGANJE IN SHRANJEVANJE V LOCALSTORAGE
    function naloziNapredek() {
        const shranjeno = localStorage.getItem(STORAGE_KEY);
        if (shranjeno) {
            try {
                const stanje = JSON.parse(shranjeno);
                trenutnoVprasanje = stanje.trenutnoVprasanje || 0;
                rezultat = stanje.rezultat || 0;
            } catch (e) {
                console.error("Napaka pri branju LocalStorage", e);
            }
        }
    }

    function shraniNapredek() {
        const stanje = {
            trenutnoVprasanje: trenutnoVprasanje,
            rezultat: rezultat
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stanje));
    }

    function ponastaviKviz() {
        if (confirm("Ali res želiš ponastaviti napredek za ta kviz?")) {
            localStorage.removeItem(STORAGE_KEY);
            trenutnoVprasanje = 0;
            rezultat = 0;
            prikaziVprasanje();
        }
    }

    // 4. PRIKAZ VPRAŠANJA IN ODGOVOROV
    function prikaziVprasanje() {
        odgovoreno = false;
        explanationDiv.style.display = 'none';
        nextBtn.style.display = 'none';

        if (trenutnoVprasanje >= vprasanja.length) {
            zakljuciKviz();
            return;
        }

        const q = vprasanja[trenutnoVprasanje];
        
        // Posodobitev indikatorjev
        questionText.textContent = `${trenutnoVprasanje + 1}. ${q.question || q.vprasanje}`;
        scoreCounter.textContent = `Rezultat: ${rezultat}/${vprasanja.length}`;
        progressFill.style.width = `${((trenutnoVprasanje) / vprasanja.length) * 100}%`;

        optionsContainer.innerHTML = '';
        const opcije = q.options || q.odgovori || [];
        const crke = ['A', 'B', 'C', 'D'];

        opcije.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-badge">${crke[idx] || (idx + 1)}</span> ${opt}`;
            btn.onclick = () => preveriOdgovor(idx);
            optionsContainer.appendChild(btn);
        });
    }

    // 5. PREVERJANJE ODGOVORA
    function preveriOdgovor(izbraniIndeks) {
        if (odgovoreno) return;
        odgovoreno = true;

        const q = vprasanja[trenutnoVprasanje];
        const pravilniIndeks = q.correct !== undefined ? q.correct : q.pravilni;
        const gumbi = optionsContainer.children;

        if (izbraniIndeks === pravilniIndeks) {
            gumbi[izbraniIndeks].classList.add('correct');
            rezultat++;
        } else {
            gumbi[izbraniIndeks].classList.add('wrong');
            if (gumbi[pravilniIndeks]) {
                gumbi[pravilniIndeks].classList.add('correct');
            }
        }

        // Onemogoči nadaljnje klike na gumbe
        Array.from(gumbi).forEach(g => g.disabled = true);

        // Prikaži razlago, če obstaja
        if (q.explanation || q.razlaga) {
            explanationText.textContent = q.explanation || q.razlaga;
            explanationDiv.style.display = 'block';
        }

        scoreCounter.textContent = `Rezultat: ${rezultat}/${vprasanja.length}`;
        nextBtn.style.display = 'inline-block';
        
        shraniNapredek();
    }

    function naslednjeVprasanje() {
        trenutnoVprasanje++;
        shraniNapredek();
        prikaziVprasanje();
    }

    function zakljuciKviz() {
        progressFill.style.width = '100%';
        questionText.textContent = "🎉 Kviz je zaključen!";
        optionsContainer.innerHTML = `
            <div style="text-align: center; padding: 20px;">
                <h3>Tvoj končni rezultat: ${rezultat} od ${vprasanja.length} točk</h3>
                <p>Uspešnost: ${Math.round((rezultat / vprasanja.length) * 100)}%</p>
            </div>
        `;
        nextBtn.style.display = 'none';
    }

    // 6. UPRAVLJANJE S TIPKOVNICO (Tipke 1, 2, 3, 4)
    document.addEventListener('keydown', function(e) {
        if (['1', '2', '3', '4'].includes(e.key)) {
            const indeks = parseInt(e.key) - 1;
            const gumbi = optionsContainer.children;
            if (gumbi[indeks] && !odgovoreno) {
                gumbi[indeks].click();
            }
        } else if (e.key === 'Enter' && odgovoreno && nextBtn.style.display !== 'none') {
            naslednjeVprasanje();
        }
    });

    // Zagon
    zagonKviza();
</script>

</body>
</html>
